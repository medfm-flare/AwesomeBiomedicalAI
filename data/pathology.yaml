- date: 2024-07
  title: A foundation model for clinical-grade computational pathology and rare cancers detection
  url: https://www.nature.com/articles/s41591-024-03141-0
  doi: 10.1038/s41591-024-03141-0
  venue: Nat. Med.
  authors:
    first:
      name: Eugene Vorontsov
      scholar: https://scholar.google.com/citations?user=5o1gS_sAAAAJ&hl=en
    last:
      name: Thomas J. Fuchs
      scholar: https://scholar.google.ch/citations?user=zh0Raz8AAAAJ&hl=en
  model:
    name: Virchow
    repo: https://github.com/Paige-AI/paige-ml-sdk
    weights: https://huggingface.co/paige-ai/Virchow
  params: 632M
  backbone: ViT-H/14
  pretraining: [DINOv2]
  pretraining_detail: Self-supervised DINOv2 pretraining on H&E whole-slide images.
  data:
    description: H&E-stained whole-slide images from a clinical archive
    scale:
      whole_slide_images: 1500000
  tasks: [detection, biomarker prediction, classification]
  tasks_detail: Pan-cancer detection including rare cancers, and biomarker prediction.
  modalities: [histopathology]
  verify:
    - >-
      Previously catalogued as "Virchow2". This Nat. Med. paper introduces Virchow;
      Virchow2 is the separate arXiv follow-up (2408.00738). Confirm and, if the team
      wants Virchow2 listed too, add it as its own entry.
    - params 632M is the standard ViT-H/14 configuration, not a figure quoted in the paper.
  added: {date: 2026-08, by: Leo Yin}

