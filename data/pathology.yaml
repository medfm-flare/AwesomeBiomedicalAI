- date: 2026-02
  title: Knowledge-enhanced pretraining for vision-language pathology foundation model on cancer diagnosis
  url: https://www.cell.com/cancer-cell/fulltext/S1535-6108(26)00058-9
  venue: Cancer Cell
  authors:
    first: {name: Xiao Zhou}
    last:
      name: Weidi Xie
      scholar: https://scholar.google.com/citations?user=Vtrqj4gAAAAJ&hl=zh-CN
  model:
    name: KEEP
    repo: https://github.com/MAGIC-AI4Med/KEEP
  backbone: ViT-L/16 vision encoder with a BERT text encoder
  pretraining: [contrastive, CLIP]
  pretraining_detail: >-
    Knowledge-enhanced vision-language pretraining using semantic-level alignment via
    metric learning within semantic groups guided by a disease knowledge graph.
  data:
    description: >-
      Pathology image-text pairs from OpenPath and Quilt-1M, reorganized into
      semantically structured groups
    scale:
      semantic_groups: 143000
  tasks: [segmentation, detection, subtyping, retrieval, classification]
  tasks_detail: >-
    Zero-shot slide-level cancer region segmentation, cancer detection and subtyping;
    tile-level cross-modal retrieval and zero-shot image classification.
  modalities: [histopathology, text]
  verify:
    - Cell Press DOI not yet recorded -- add it so dedup keys on DOI rather than title.
  added: {date: 2026-08, by: Leo Yin}

- date: 2025-11
  title: SMMILe enables accurate spatial quantification in digital pathology using multiple-instance learning
  url: https://www.nature.com/articles/s43018-025-01060-8
  doi: 10.1038/s43018-025-01060-8
  venue: Nat. Cancer
  authors:
    first:
      name: Zeyu Gao
      scholar: https://scholar.google.com/citations?hl=zh-CN&user=CeP6dkcAAAAJ
    last:
      name: Mireia Crispin-Ortuzar
      scholar: https://scholar.google.com/citations?hl=en&user=TRZzLJgAAAAJ
  model:
    name: SMMILe
    repo: https://github.com/ZeyuGaoAi/SMMILe
  backbone: >-
    ResNet-50 and CONCH patch encoders with an instance-based multiple-instance-learning
    architecture using superpatch and refinement modules
  pretraining: [weakly supervised]
  pretraining_detail: >-
    Feature extraction with pretrained encoders (ImageNet ResNet-50, pathology
    foundation model CONCH), then weakly supervised MIL training with slide-level labels.
  data:
    description: 8 datasets covering 6 cancer types
    scale:
      whole_slide_images: 3850
      datasets: 8
      cancer_types: 6
  tasks: [classification, detection, subtyping, grading]
  tasks_detail: >-
    WSI-level classification and patch-level spatial quantification, including metastasis
    detection, subtype prediction and grading.
  modalities: [histopathology]
  added: {date: 2026-08, by: Leo Yin}

- date: 2025-11
  title: A multimodal whole-slide foundation model for pathology
  url: https://www.nature.com/articles/s41591-025-03982-3
  doi: 10.1038/s41591-025-03982-3
  venue: Nat. Med.
  authors:
    first:
      name: Tong Ding
      scholar: https://scholar.google.com/citations?user=Vwt2ZVYAAAAJ&hl=en
    last:
      name: Faisal Mahmood
      scholar: https://scholar.google.com/citations?user=9MsdbKoAAAAJ&hl=en
  model:
    name: TITAN
    repo: https://github.com/mahmoodlab/TITAN
    weights: https://huggingface.co/MahmoodLab/TITAN
  backbone: ViT slide encoder (Transformer-based Image and Text Alignment Network) over CONCH v1.5 patch features
