# Pathology -- histopathology, whole-slide imaging and computational pathology.
#
# Source of truth for pathology.md. After editing, run:
#     python scripts/build.py
# CI will reject the PR if the generated markdown is out of date.
#
# Field reference: CONTRIBUTING.md

- date: 2026-07
  title: End-to-end multimodal pathology foundation model with clinical dialogue
  url: https://www.nature.com/articles/s41591-026-04521-4
  doi: 10.1038/s41591-026-04521-4
  venue: Nat. Med.
  authors:
    first:
      name: Eugene Vorontsov
      scholar: https://scholar.google.com/citations?user=5o1gS_sAAAAJ&hl=en
    last:
      name: Siqi Liu
      scholar: https://scholar.google.com/citations?hl=en&user=ADyo_cAAAAAJ
  model:
    name: PRISM2
    weights: https://huggingface.co/paige-ai/Prism2
  params: 4.6B
  backbone: >-
    Virchow2 tile encoder, Perceiver slide encoder, BioGPT language encoder and a
    Phi-3 Mini 3.8B decoder-only LLM
  pretraining: [contrastive, next-token prediction]
  pretraining_detail: >-
    Two-stage language-supervised multimodal pre-training: contrastive slide-report
    alignment, then autoregressive clinical-dialogue learning. The slide encoder is
    frozen while Phi-3 Mini is fine-tuned in stage 2.
  data:
    description: H&E whole-slide images with paired clinical reports, converted into question-answer pairs
    scale:
      whole_slide_images: 2350518
      specimens: 685507
      patients: 200692
      qa_pairs: 14000000
  tasks: [detection, subtyping, biomarker prediction, survival prediction, report generation]
  tasks_detail: >-
    Prompt-based cancer detection and subtyping; diagnostic, biomarker and survival
    prediction; pathology report completion.
  modalities: [histopathology, text]
  added: {date: 2026-08, by: Leo Yin}

- date: 2026-04
  title: PRET is a few-shot system for pan-cancer recognition without example training
  url: https://www.nature.com/articles/s43018-026-01141-2
  doi: 10.1038/s43018-026-01141-2
  venue: Nat. Cancer
  authors:
    first:
      name: Yi Li
      scholar: https://scholar.google.com/citations?user=qGsK180AAAAJ&hl=en
    last:
      name: Xiaomeng Li
      scholar: https://scholar.google.com/citations?user=uVTzPpoAAAAJ&hl=en
  model:
    name: PRET
    repo: https://github.com/xmed-lab/PRET
  backbone: >-
    Default feature extractor is a DINO-pretrained ViT-S/8 pathology encoder; PRET adds
    an in-context tagger, in-context classifier, instance miner, attention aggregator
    and postprocessor
  pretraining: [DINO, self-supervised]
  pretraining_detail: >-
    Training-free for downstream tasks. The default encoder was pretrained
    self-supervised on unlabeled TCGA pathology images.
  data:
    description: >-
      No task-specific training images for PRET itself. Evaluated on 4,484 WSIs across
      23 benchmarks. The paper does not state a numeric TCGA pretraining image count for
      the default encoder.
    scale:
      evaluation_wsi: 4484
      benchmarks: 23
  tasks: [detection, subtyping, segmentation, classification]
  tasks_detail: Cancer screening, cancer subtyping, tumour segmentation, lymph node metastasis detection.
  modalities: [histopathology]
  added: {date: 2026-08, by: Leo Yin}

- date: 2026-03
  title: Confounding factors and biases abound when predicting molecular biomarkers from histological images
  url: https://www.nature.com/articles/s41551-026-01616-8
  doi: 10.1038/s41551-026-01616-8
  venue: Nat. Biomed. Eng.
  authors:
    first:
      name: Muhammad Dawood
      scholar: https://scholar.google.com/citations?hl=en&user=a-szm64AAAAJ
    last:
      name: Fayyaz ul Amir Afsar Minhas
      scholar: https://scholar.google.com/citations?hl=en&user=cQ6eO_kAAAAJ
  model:
    name: HistBiases
    repo: https://github.com/imuhdawood/HistBiases
  backbone: >-
    Benchmarking study rather than a new model. Evaluates CLAM, SlideGraph-infinity and
    TITAN, with CTransPath and ShuffleNet patch encoders.
  pretraining: [self-supervised, weakly supervised]
  pretraining_detail: >-
    CTransPath pretrained on histology via self-supervised learning; ShuffleNet
    pretrained on ImageNet; TITAN trained on 330,000 image-text pairs.
  data:
    description: >-
      H&E WSIs from TCGA, METABRIC, MSK and DFCI. Weakly supervised models trained on
      TCGA and validated on CPTAC and ABCTB.
    scale:
      patients: 8221
  tasks: [biomarker prediction, mutation prediction, benchmarking]
  tasks_detail: >-
    Molecular biomarker and gene mutation prediction from WSIs, plus a
    confounding/stratification analysis against biomarker interdependency, grade and TMB.
  modalities: [histopathology]
  note: Benchmarking and bias study, not a new foundation model.
  added: {date: 2026-08, by: Leo Yin}

- date: 2026-02
  title: >-
    Classification accuracy of a hierarchical molecular inference-based deep-learning
    system for CNS tumour diagnosis: a multi-institutional, retrospective study
  url: https://www.thelancet.com/journals/lanonc/article/PIIS1470-2045(25)00661-8/abstract
  doi: 10.1016/S1470-2045(25)00661-8
  venue: Lancet Oncol.
  authors:
    first: {name: H. Lalchungnunga}
    last: {name: Kenneth Aldape}
  model:
    name: Neuropath-AI
    weights: https://methylscape.ccr.cancer.gov/
  backbone: >-
    UNI large vision transformer plus hierarchical submodules using MLPs and ensemble
    classifiers (random forest, SVM, KNN, logistic regression)
  pretraining: [self-supervised]
  pretraining_detail: >-
    WSI-pretrained UNI encoder followed by molecular inference-based hierarchical
    classification.
  data:
    description: Multi-institutional retrospective CNS tumour cohort
    scale:
      whole_slide_images: 5835
  tasks: [classification, mutation prediction, gene expression prediction]
  tasks_detail: >-
    CNS tumour family-level classification, 52 terminal CNS tumour types, IDH mutation
    prediction, inferred gene expression and DNA methylation.
  modalities: [histopathology]
  added: {date: 2026-08, by: Leo Yin}

- date: 2026-02
  title: >-
    Development and validation of a computational histology artificial
    intelligence-powered predictive biomarker for selection of chemotherapy in advanced
    pancreatic cancer
  url: https://ascopubs.org/doi/10.1200/JCO-25-02199
  doi: 10.1200/JCO-25-02199
  venue: J. Clin. Oncol.
  authors:
    first:
      name: Andrew Hendifar
      scholar: https://scholar.google.com/citations?hl=en&user=XwWT-TMAAAAJ
    last:
      name: Jennifer J. Knox
      scholar: https://scholar.google.com/citations?user=6aEaHzcAAAAJ&hl=en
  model:
    name: CHAI
  backbone: Not stated in the paper
  pretraining: [supervised]
  pretraining_detail: >-
    Pan-cancer H&E slides are patched and merged with indication labels to form a base
    model for cell and tissue classification.
  data:
    description: Pan-cancer H&E-stained slides
